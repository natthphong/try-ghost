<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>บ้านเช่าหลังสุดท้าย</title>
</head>
<body>
  <div id="stage" data-view="exterior">
    <div id="scene">
      <img id="base" alt="" />
      <div id="layers"></div>
      <div id="fxpatch"><div class="garland"></div><div class="slippers"></div><div class="yantra"></div></div>
      <div id="tvreflect"><img src="views/living/tv_feed_turn.webp" alt="" /></div>
      <div id="tv" hidden><img id="tvfeed" alt="" /><div class="scan"></div></div>
      <div id="clock"><i class="h"></i><i class="m"></i></div>
      <div id="mirrorname" hidden></div><div id="passer"></div>
    </div>
    <div id="tint"></div><div id="redglow"></div><div id="handshadow"></div><div id="steam"></div>
    <canvas id="grain"></canvas><div id="vignette"></div>
    <div id="hot"></div><div id="nav"></div>
    <button id="phonebtn" aria-label="ดูโทรศัพท์"><kbd>Q</kbd><span>ดูโทรศัพท์</span></button>
    <div id="phone" hidden></div>
    <div id="hint" hidden><kbd>E</kbd>ทำ · <kbd>←</kbd><kbd>→</kbd>เดินไปห้องอื่น · <kbd>Q</kbd>ดูโทรศัพท์ (มือถือ: แตะป้าย)</div>
    <div id="flash" hidden><img alt="" /></div>
    <div id="black"></div>
    <div id="screen"></div>
  </div>
  <div id="rotate"><p>หมุนจอเป็นแนวนอน</p><p class="s">เกมนี้เล่นแนวนอน และหลอนด้วยเสียง ใส่หูฟัง</p></div>
  <pre id="debug" hidden></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
